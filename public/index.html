<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="CineSearch — instant movie search powered by Algolia." />
  <meta name="author" content="Wendy Rizza V. Calma" />
  <title>CineSearch — Movie Discovery</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎬</text></svg>" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/instantsearch.css@8.23.0/themes/reset-min.css" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>

  <header class="header">
    <div class="logo">Cine<span>Search</span></div>
    <div id="searchbox" role="search"></div>
  </header>

  <main class="page">

    <aside class="sidebar" aria-label="Filters">
      <div class="filter-block">
        <h2 class="filter-title">Active Filters</h2>
        <div id="current-refinements"></div>
        <div id="clear-all" style="margin-top:0.5rem;"></div>
      </div>
      <div class="filter-block">
        <h2 class="filter-title">Genre</h2>
        <div id="genre-filter"></div>
      </div>
      <div class="filter-block">
        <h2 class="filter-title">Year Released</h2>
        <div id="year-filter"></div>
      </div>
    </aside>

    <section class="results" aria-label="Search results">
      <div class="results-meta">
        <div id="stats" aria-live="polite"></div>
        <span id="demo-badge" class="demo-badge" hidden
              title="Algolia is not connected, so results come from built-in sample data.">Demo data</span>
      </div>
      <div id="hits"></div>
      <div id="pagination"></div>
    </section>

  </main>

  <script src="https://cdn.jsdelivr.net/npm/algoliasearch@4.27.0/dist/algoliasearch-lite.umd.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/instantsearch.js@4.118.0/dist/instantsearch.production.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/demo-data.js"></script>
  <script src="js/demo-search.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
